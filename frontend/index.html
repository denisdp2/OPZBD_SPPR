<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2438">
  <meta name="description" content="Вход в учётную запись">
  <title>Вход — СППР</title>
  <link rel="stylesheet" href="/static/css/app.css?v=coverage-review-6">
  <link rel="stylesheet" href="/static/assets/css/auth.css?v=centered-1">
  <script type="module" src="/static/assets/js/pages/auth-page.js?v=centered-1"></script>
</head>
<body>
  <main class="auth-shell">
    <div class="card auth-card-panel">
      <div class="brand-name">СППР</div>
      <nav class="auth-tabs" aria-label="Учётная запись">
        <button class="btn auth-tab" type="button" aria-current="page" data-view="login">Вход</button>
        <button class="btn secondary auth-tab" type="button" data-view="register">Регистрация</button>
      </nav>

      <section id="login-view" aria-labelledby="login-title">
        <h1 id="login-title">Вход</h1>
        <form id="login-form" novalidate>
          <label for="login-name">Логин</label>
          <input id="login-name" name="login" type="text" autocomplete="username" required maxlength="64">
          <label for="login-password">Пароль</label>
          <div class="auth-password">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn secondary" type="button" data-password-toggle="login-password" aria-label="Показать пароль">Показать</button>
          </div>
          <div class="toolbar auth-actions">
            <button class="btn" type="submit">Войти</button>
            <button class="btn secondary" type="button" data-view="forgot">Забыли пароль?</button>
          </div>
          <div class="form-message" id="login-message" role="status" hidden></div>
        </form>
      </section>

      <section id="register-view" aria-labelledby="register-title" hidden>
        <h1 id="register-title">Регистрация</h1>
        <form id="register-form" novalidate>
          <label for="register-name">Логин</label>
          <input id="register-name" name="login" type="text" autocomplete="username" required minlength="3" maxlength="64" aria-describedby="register-login-hint">
          <p class="auth-hint" id="register-login-hint">Не менее 3 символов.</p>
          <label for="register-password">Пароль</label>
          <div class="auth-password">
            <input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="register-password-hint">
            <button class="btn secondary" type="button" data-password-toggle="register-password" aria-label="Показать пароль">Показать</button>
          </div>
          <p class="auth-hint" id="register-password-hint">Не менее 8 символов.</p>
          <div class="toolbar auth-actions"><button class="btn" type="submit">Создать аккаунт</button></div>
          <div class="form-message" id="register-message" role="status" hidden></div>
        </form>
      </section>

      <section id="forgot-view" aria-labelledby="forgot-title" hidden>
        <h1 id="forgot-title">Восстановление доступа</h1>
        <p>Сообщите администратору свой логин, чтобы он мог задать новый пароль.</p>
        <button class="btn secondary" type="button" data-view="login">Назад ко входу</button>
      </section>
    </div>
  </main>
</body>
</html>
