name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: Тесты (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install -e ".[dev]"
      - name: Линтер
        run: ruff check .
      - name: Форматирование
        run: ruff format --check .
      - name: Тесты
        run: pytest -q
