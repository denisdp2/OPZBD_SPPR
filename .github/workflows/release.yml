name: Release

# Сборка портативной версии под Windows и Linux.
#   * вручную: Actions → Release → Run workflow (архивы в артефактах запуска);
#   * по тегу: git tag v0.1.0 && git push origin v0.1.0 (архивы в Releases).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: write

jobs:
  build:
    name: Сборка (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # Linux собираем на старой Ubuntu: бинарник работает на этой версии и новее.
        include:
          - os: windows-latest
            target: windows
            python: "3.12"
            architecture: x64
          - os: ubuntu-22.04
            target: linux
            python: "3.12"
            architecture: x64
          - os: windows-2022
            target: windows-legacy-x64
            python: "3.8.10"
            architecture: x64
          - os: windows-2022
            target: windows-legacy-x86
            python: "3.8.10"
            architecture: x86
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          cache: pip
      - if: ${{ !startsWith(matrix.target, 'windows-legacy-') }}
        run: python -m pip install ".[build]"
      - if: startsWith(matrix.target, 'windows-legacy-')
        run: python -m pip install "." "pytest>=8,<9" "pyinstaller==6.10.0"
      - if: startsWith(matrix.target, 'windows-legacy-')
        run: python -m pytest -q
      - run: python scripts/build.py
      - name: Проверка запуска собранной программы
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/SZI-${{ matrix.target }}/szi/szi.exe; else BIN=dist/SZI-linux/szi/szi; fi
          "$BIN" --version
      - uses: actions/upload-artifact@v4
        with:
          name: SZI-${{ matrix.target }}
          path: dist/SZI-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
